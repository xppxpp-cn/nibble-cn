# Fork-only releases. Never pushes to the upstream author's Homebrew tap.
name: 发布 Nibble 中文版

on:
  push:
    tags:
      - "cn-v*"

permissions:
  contents: write

jobs:
  release:
    name: 编译并发布 macOS 中文版
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: make test
      - name: Build universal application
        run: |
          make universal
          make app
          ARCHS="$(lipo -archs Nibble.app/Contents/MacOS/nibble)"
          echo "$ARCHS" | grep -q arm64
          echo "$ARCHS" | grep -q x86_64
          codesign --verify --deep Nibble.app
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw -o - Nibble.app/Contents/Info.plist)"
          echo "Bundle ID: $BUNDLE_ID"
          test "$BUNDLE_ID" = "com.xppxpp.nibblecn"
          DISPLAY_NAME="$(plutil -extract CFBundleDisplayName raw -o - Nibble.app/Contents/Info.plist)"
          test "$DISPLAY_NAME" = "Nibble 中文版"
      - name: Create ZIP archive
        run: |
          ditto -c -k --keepParent Nibble.app Nibble-zh-CN-macOS-universal.zip
          shasum -a 256 Nibble-zh-CN-macOS-universal.zip
      - name: Create this fork's GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Nibble-zh-CN-macOS-universal.zip \
            --title "Nibble 中文版 $GITHUB_REF_NAME" \
            --notes "个人使用的简体中文本地化版本；保留上游设备功能和配置格式。自签 / ad-hoc 构建，未经 Apple 公证。"
